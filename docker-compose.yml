services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nearfm
      POSTGRES_USER: nearfm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nearfm_dev}
    ports:
      - "5499:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearfm"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-mainnet:
    image: postgres:17
    environment:
      POSTGRES_DB: nearfm
      POSTGRES_USER: nearfm
      POSTGRES_PASSWORD: ${DB_PASSWORD_MAINNET:-nearfm_dev}
    ports:
      - "5508:5432"
    volumes:
      - pgdata_mainnet:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nearfm"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    ports:
      - "8477:8477"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-mainnet:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://nearfm:nearfm_dev@postgres:5432/nearfm}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      NEAR_NETWORK: ${NEAR_NETWORK:-testnet}
      CONTRACT_ID: ${CONTRACT_ID:-near-fm.testnet}
      FASTFS_RECEIVER: ${FASTFS_RECEIVER:-fastfs.testnet}
      NEAR_RPC_URL: ${NEAR_RPC_URL:-https://rpc.testnet.near.org}
      ADMIN_ACCOUNTS: ${ADMIN_ACCOUNTS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3847}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3847}
      RUST_LOG: ${RUST_LOG:-nearfm_server=info,tower_http=info}
      SUNO_API_KEY: ${SUNO_API_KEY:-}
      PORT: "8477"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8477}
        NEXT_PUBLIC_CONTRACT_ID: ${CONTRACT_ID:-near-fm.testnet}
        NEXT_PUBLIC_NEAR_NETWORK: ${NEAR_NETWORK:-testnet}
        NEXT_PUBLIC_FASTFS_RECEIVER: ${FASTFS_RECEIVER:-fastfs.testnet}
        NEXT_PUBLIC_NEAR_RPC_URL: ${NEAR_RPC_URL:-https://rpc.testnet.near.org}
        NEXT_PUBLIC_ADMIN_ACCOUNTS: ${NEXT_PUBLIC_ADMIN_ACCOUNTS:-}
    ports:
      - "3847:3847"
    depends_on:
      - server
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8477}
      NEXT_PUBLIC_CONTRACT_ID: ${CONTRACT_ID:-near-fm.testnet}
      NEXT_PUBLIC_NEAR_NETWORK: ${NEAR_NETWORK:-testnet}
      NEXT_PUBLIC_FASTFS_RECEIVER: ${FASTFS_RECEIVER:-fastfs.testnet}
      NEXT_PUBLIC_NEAR_RPC_URL: ${NEAR_RPC_URL:-https://rpc.testnet.near.org}
      NEXT_PUBLIC_ADMIN_ACCOUNTS: ${NEXT_PUBLIC_ADMIN_ACCOUNTS:-}
      PORT: "3847"

volumes:
  pgdata:
  pgdata_mainnet:
